services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    environment:
      TZ: "Asia/Tehran"
    network_mode: host
#    ports:
#      - '80:80'      # پورت HTTP عمومی
#      - '81:81'      # پورت مدیریت وب
#      - '443:443'    # پورت HTTPS عمومی
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt