services:
  gitlab:
    image: gitlab/gitlab-ce:18.6.1-ce.0
    restart: always
    hostname: ${DEFAULT_PUBLIC_IP_V4}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "https://gitlab.sepehrino.com";
        registry_external_url "https://registry.sepehrino.com";
        gitlab_rails['gitlab_shell_ssh_port'] = 2222;
        gitlab_rails['lfs_enabled'] = true;
        registry['enable'] = true;
        nginx['redirecthttpto_https'] = true
        nginx['ssl_certificate'] = "/etc/gitlab/ssl/gitlab.sepehrino.com.crt"
        nginx['sslcertificatekey'] = "/etc/gitlab/ssl/gitlab.sepehrino.com.key"
    ports:
#      - ${DEFAULT_PUBLIC_IP_V4}:80:80
      - ${DEFAULT_PUBLIC_IP_V4}:443:443
      - ${DEFAULT_PUBLIC_IP_V4}:2222:22
    volumes:
      - ${GITLAB_HOME}/config:/etc/gitlab
      - ${GITLAB_HOME}/logs:/var/log/gitlab
      - ${GITLAB_HOME}/data:/var/opt/gitlab
    shm_size: "256m"
