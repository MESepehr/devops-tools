services:
  postgres:
    build: DockerfilePSQL18
    container_name: pg_server18
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=${PG_DB}
    volumes:
      # Change this line - mount parent directory instead
      - ./pg_data:/var/lib/postgresql
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf
    restart: unless-stopped
    env_file:
      - .env

volumes:
  pg_data:
    driver: local
