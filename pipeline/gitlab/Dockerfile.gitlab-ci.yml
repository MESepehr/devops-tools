stages:
  - build
  # - deploy

variables:
  IMAGE_NAME: vakilemon-landing-image
  IMAGE_TAG: latest
  IMAGE_FILE: vakilemon-landing.tar
  SERVER_USER: $SERVER_USER
  SERVER_IP: $SERVER_IP
  SERVER_PATH: $SERVER_PATH
  SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY

###########################
#       BUILD Docker
###########################
build_docker_image:
  tags:
    - shell
  stage: build
  script:
    - echo "Force Dockerfile to user runflare mirror"
    - sed -i 's|^RUN npm install|RUN npm install --registry="https://mirror-npm.runflare.com"|' Dockerfile
    - echo "Building Docker image..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - echo "Saving Docker image to file $IMAGE_FILE"
    - docker save $IMAGE_NAME:$IMAGE_TAG -o $IMAGE_FILE
    - pwd
  # artifacts:
  #   paths:
  #     - $IMAGE_FILE
  #   expire_in: 2 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

