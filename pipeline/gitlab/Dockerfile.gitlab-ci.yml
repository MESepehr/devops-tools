    #     wget https://codekit.s3.ir-thr-at1.arvanstorage.ir/dotnetaspnet9.0.tar -O dotnetaspnet9.0.tar
    #     docker load -i dotnetaspnet9.0.tar
    #   fi
    ## Microsoft bypass done

    - echo "Building Docker image $CI_REGISTRY_IMAGE:$IMAGE_TAG_..."
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG_ .


    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG_

    ## 2. Image file sharing mode
    # - echo "Saving Docker image to file $CI_PROJECT_NAME.tar"
    # - docker save $CI_REGISTRY_IMAGE:$IMAGE_TAG_ -o $IMAGE_NAME_.tar

    # - scp -P $SSH_PORT_ -o IdentityFile=~/.ssh/id_edtemp $IMAGE_NAME_.tar $SERVER_USER_@$SERVER_IP_:~/$SERVER_PATH_/.


deploy_docker_image:
  tags:
    - shell
  stage: deploy
  only:
      - beta
  needs:
    - build_docker_image
  script:
    
    - echo "Copy .env file"
    - cp $ENV_FILE_ .env


    ## Get ready to send image file to server
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_" > ~/.ssh/id_edtemp
    - chmod 600 ~/.ssh/id_edtemp
    - ssh-keyscan -p $SSH_PORT_ $SERVER_IP_ >> ~/.ssh/known_hosts

    ## Make docker-compose ready and export to servre
    - echo "Make docker-compose ready and export to servre"
    - sed -i "s|image:.*|image:\ ${IMAGE_NAME_:IMAGE_TAG_}|" $SRC_DIRECTORY_/docker-compose.yml
    - sed -i "s|\$EXPOSE_PORT|${lOCAL_PORT_}|g" $SRC_DIRECTORY_/docker-compose.yml

    - scp -P $SSH_PORT_ -o IdentityFile=~/.ssh/id_edtemp $SRC_DIRECTORY_/docker-compose.yml $SERVER_USER_@$SERVER_IP_:~/$SERVER_PATH_/.
    - scp -P $SSH_PORT_ -o IdentityFile=~/.ssh/id_edtemp $SRC_DIRECTORY_/.env $SERVER_USER_@$SERVER_IP_:~/$SERVER_PATH_/.

    ## 1. Now push the Image to self registry
    - |
      ssh -p $SSH_PORT_ -o StrictHostKeyChecking=no \
          -o IdentityFile=~/.ssh/id_edtemp \
          $SERVER_USER_@$SERVER_IP_ << EOF
            echo "Move to ${SERVER_PATH_}"
            cd ${SERVER_PATH_}
            echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
            docker compose pull
            docker compose down
            docker compose up -d
      EOF

    ## 2. Image file sharing mode
    # - scp -P $SSH_PORT_ -o IdentityFile=~/.ssh/id_edtemp $IMAGE_NAME_.tar $SERVER_USER_@$SERVER_IP_:~/$SERVER_PATH_/.
    # - rm $IMAGE_NAME_.tar

