stages:
  - build
  - deploy

variables:
  IMAGE_NAME_: $CI_REGISTRY_IMAGE
  IMAGE_TAG_: latest
  SERVER_USER_: $SERVER_USER_BETA
  SERVER_IP_: $SERVER_IP_BETA
  SSH_PRIVATE_KEY_: $SSH_PRIVATE_KEY_BETA
  SSH_PORT_: $SSH_PORT
  SRC_DIRECTORY_: '.'
  SERVER_PATH_: $SERVER_PATH_BETA
  lOCAL_PORT_: $lOCAL_PORT_BETA
  ENV_FILE_: $ENV_FILE_BETA

