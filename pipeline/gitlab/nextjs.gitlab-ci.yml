stages:
    - build
    # - deploy


variables:
  BUILD_DIR: build
  SERVER_USER: $SERVER_USER_BETA
  SERVER_IP: $SERVER_IP_BETA
  SERVER_PATH: $SERVER_PATH_BETA
  SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY_BETA

build:
    image: node:20
    stage: build
    only:
        - beta
    before_script:
        - echo "Switch to runflare repositories"
        - sed -i 's/deb.debian.org/mirror-linux.runflare.com/g' /etc/apt/sources.list.d/debian.sources
        - apt update -y && apt install -y openssh-client
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - echo "Host $SERVER_IP" >> ~/.ssh/config
        - echo "    StrictHostKeyChecking no" >> ~/.ssh/config # Be cautious with this in production!
        - chmod 644 ~/.ssh/config
    script:
        - echo "Switch to Iran mirror for npm"
        - npm config set registry https://mirror-npm.runflare.com
        - npm --silent i --force
        - echo "Set .env file to project"
        - cp .env.example .env
        # - cp $ENV_FILE ./.env
        - npm --silent run build
        - mkdir export
        - mv .env export/.
        - mv .next export/.
        - mv public export/.
        - mv node_modules export/.
        - echo "Sync data to server"
        - apt install -y rsync
        - rsync -az --delete ./export/* ${SERVER_USER}@${SERVER_IP}:${SERVER_PATH}
        - rsync -az --delete ./export/.* ${SERVER_USER}@${SERVER_IP}:${SERVER_PATH}
        - echo "Make node_modules back to cache folder"
        - mv export/node_modules .
    # artifacts:
    #     paths:
    #         - export
    #     expire_in: 1 hour
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules/


