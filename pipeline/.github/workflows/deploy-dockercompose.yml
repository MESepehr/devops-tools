name: Build and deploy

on:
  push:
    branches: [main,cicd]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create deployment environment file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          set -eu
          test -n "$ENV_FILE_CONTENT"
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          chmod 600 .env

      - name: Set immutable image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          image="ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose --env-file .env config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api and worker use the same Dockerfile, so one image runs both services.
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create deployment environment file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          set -eu
          test -n "$ENV_FILE_CONTENT"
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          chmod 600 .env

      - name: Set immutable image tag
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          image="ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Prepare deployment environment
        run: |
          set -eu
          awk '!/^APP_IMAGE=/' .env > .env.deploy
          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" >> .env.deploy
          chmod 600 .env.deploy

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' 'Host *' '  StrictHostKeyChecking accept-new' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload Compose and environment files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -eu
          case "$SERVER_PORT" in (*[!0-9]*|'') exit 1;; esac
          case "$SERVER_USER" in (*[!A-Za-z0-9._-]*|'') exit 1;; esac

          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$SERVER_PORT" docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/docker-compose.yml.next"
          scp -P "$SERVER_PORT" .env.deploy \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/.env.next"

      - name: Log the server in to GHCR
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -eu
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          case "$GHCR_USERNAME" in (*[!A-Za-z0-9_-]*) exit 1;; esac
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pull and restart services
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -eu
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "
            set -eu
            cd '$DEPLOY_PATH'
            pwd
            # docker compose --env-file .env.next -f docker-compose.yml.next config --quiet
            # chmod 600 .env.next
            cp .env .env.back
            mv .env.next .env
            docker compose -f docker-compose.yml.next pull
            mv docker-compose.yml.next docker-compose.yml
            docker compose down
            docker compose up -d --no-build
          "
