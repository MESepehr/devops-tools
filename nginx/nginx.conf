server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
        
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        try_files $uri =404; 
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
